server:
  port: ${PORT:8080}

spring:
  application:
    name: order-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.konrad: DEBUG
    root: WARN

konrad:
  services:
    product-url:      ${PRODUCT_SERVICE_URL:http://localhost:8083}
    payment-url:      ${PAYMENT_SERVICE_URL:http://localhost:8085}
    # CORRECCION #6: se agregan las URLs faltantes.
    # notification-url: para enviar correo de confirmacion de compra al comprador
    # seller-url:       para llamar a POST /sellers/{id}/rating tras la compra,
    #                   y para decrementar el stock del producto del vendedor
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    seller-url:       ${SELLER_SERVICE_URL:http://localhost:8082}
  mock:
    enabled: true