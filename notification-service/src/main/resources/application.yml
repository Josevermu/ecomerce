server:
  port: ${PORT:8080}

spring:
  application:
    name: notification-service
  # CORRECCION: sin esta seccion Spring Boot intenta auto-configurar JavaMailSender
  # con el host 'mock-smtp-no-disponible'. El actuator tiene un MailHealthIndicator
  # que al arrancar hace una conexion real al SMTP y falla con MailConnectException.
  # Soluciones posibles:
  #   A) Deshabilitar el health indicator de mail (lo que hacemos aqui)
  #   B) Excluir MailHealthContributorAutoConfiguration completo
  # Elegimos A porque es menos invasivo y deja el resto del actuator funcionando.
  mail:
    host: ${SMTP_HOST:mock-smtp-no-disponible}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:mock@mock.com}
    password: ${SMTP_PASS:mock-pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    # CORRECCION: deshabilita el health check de SMTP.
    # En modo mock no hay servidor de correo real — si queda habilitado,
    # el actuator marca el servicio como DOWN aunque todo lo demas funcione,
    # y Azure lo marca como unhealthy y reinicia el container en loop.
    mail:
      enabled: false

logging:
  level:
    com.konrad: DEBUG
    root: WARN

konrad:
  mock:
    enabled: true

azure:
  servicebus:
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:mock}