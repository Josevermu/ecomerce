server:
  port: ${PORT:8080}

spring:
  application:
    name: seller-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.konrad: DEBUG
    root: WARN

konrad:
  services:
    notification-url:   ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    auth-url:           ${AUTH_SERVICE_URL:http://localhost:8081}
    # CORRECCION #5: se agrega credit-check-url.
    # El Director Comercial al revisar una solicitud dispara la verificacion
    # de Datacredito + CIFIN + Policia. seller-service llama a credit-check-service
    # internamente para obtener ese resultado (flujo del punto 2 del enunciado).
    credit-check-url:   ${CREDIT_CHECK_SERVICE_URL:http://localhost:8087}
  mock:
    enabled: true

azure:
  servicebus:
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:mock}