server:
  port: ${PORT:8080}

spring:
  application:
    name: buyer-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.konrad: DEBUG
    root: WARN

konrad:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
    notification-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
  mock:
    enabled: true

azure:
  servicebus:
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:mock}