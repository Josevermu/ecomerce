server:
  port: ${PORT:8080}

spring:
  application:
    name: auth-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  # CORRECCION #4: se elimino 'management.server.port: ${PORT:8080}'
  # Esa propiedad le decia a Spring Boot que el actuator corriera en
  # un puerto separado (aunque era el mismo numero).
  # Cuando management.server.port == server.port, Spring Boot puede
  # intentar abrir dos veces el mismo puerto y fallar al arrancar
  # dependiendo de la version. Sin la propiedad, el actuator comparte
  # el puerto de la aplicacion automaticamente, que es lo correcto aqui.

logging:
  level:
    com.konrad: DEBUG
    root: WARN

konrad:
  jwt:
    secret: ${JWT_SECRET:konrad-ecommerce-super-secret-key-2024-arquitectura-software}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mock:
    enabled: true