server:
  port: ${PORT:8080}

spring:
  application:
    name: auth-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      # CORRECCION: el actuator tiene su propia auto-config de seguridad que
      # tambien necesita HttpSecurity. Sin esta linea el contenedor no arranca.
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.konrad: DEBUG
    root: WARN

konrad:
  jwt:
    secret: ${JWT_SECRET:konrad-ecommerce-super-secret-key-2024-arquitectura-software}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  mock:
    enabled: true